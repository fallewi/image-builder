apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-manifest
  namespace: default
data:
  values.yaml: |
    kubeProxyReplacement: true

    k8sServiceHost: 192.168.100.40
    k8sServicePort: 6443

    ipam:
      mode: kubernetes

    routingMode: native

    operator:
      replicas: 1

    hubble:
      enabled: true

    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
